name: Benchmark fresh-runner verification
on:
  push:
    branches: [ci/submitted-pr-checks-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact benchmark PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6434c750471331b75ae2b218ffec0760d175530c
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install project and ASV
        run: python -m pip install . asv
      - name: Register the fresh runner
        run: asv machine --yes
      - name: Validate all benchmark definitions
        run: asv check --python=same
      - name: Smoke-test all 24 cases
        run: asv run --python=same --quick --show-stderr --dry-run
